<svg xmlns="http://www.w3.org/2000/svg" width="700" height="100" viewBox="0 0 700 100">
<defs>
<filter id="glow">
<feGaussianBlur stdDeviation="3.5" result="blur"/>
<feComposite in="SourceGraphic" in2="blur" operator="over"/>
</filter>
</defs>
<style>
@keyframes pulse {
0%, 100% { opacity: 0.7; filter: drop-shadow(0 0 6px #8A2BE2); }
50% { opacity: 1; filter: drop-shadow(0 0 16px #9370DB); }
}
@keyframes fadeUp {
from { opacity: 0; }
to { opacity: 0.8; }
}
.motto { animation: pulse 3.5s ease-in-out infinite; }
.sub { animation: fadeUp 2s 0.5s ease-out forwards; opacity: 0; }
</style>
<rect width="100%" height="100%" fill="#0d1117" rx="8"/>
<text x="350" y="46" text-anchor="middle" font-family="'Georgia','Playfair Display',serif" font-size="28" font-weight="700" fill="#a78bfa" class="motto">✦  Ad Astra Per Aspera  ✦</text>
<text x="350" y="74" text-anchor="middle" font-family="'Georgia',serif" font-size="13" fill="#8b949e" font-style="italic" class="sub">Through Hardships to the Stars</text>
</svg>
