<svg xmlns="http://www.w3.org/2000/svg" width="860" height="120" viewBox="0 0 860 120">
<defs>
<linearGradient id="cosmicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
<stop offset="0%" stop-color="#C084FC"/>
<stop offset="30%" stop-color="#818CF8"/>
<stop offset="50%" stop-color="#E0E7FF"/>
<stop offset="70%" stop-color="#818CF8"/>
<stop offset="100%" stop-color="#C084FC"/>
</linearGradient>
<linearGradient id="cosmicText" x1="0%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="35%" stop-color="#E9D5FF"/>
<stop offset="70%" stop-color="#A855F7"/>
<stop offset="100%" stop-color="#7C3AED"/>
</linearGradient>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&amp;family=Cinzel:wght@600;700&amp;display=swap');
@keyframes cosmicPulse {
0%, 100% {
filter: drop-shadow(0 0 8px rgba(168, 85, 247, 0.45)) drop-shadow(0 0 20px rgba(129, 140, 248, 0.25));
opacity: 0.95;
}
50% {
filter: drop-shadow(0 0 16px rgba(233, 213, 255, 0.85)) drop-shadow(0 0 32px rgba(168, 85, 247, 0.65));
opacity: 1;
}
}
@keyframes twinkleGold {
0%, 100% { transform: scale(0.3) rotate(0deg); opacity: 0.2; }
50% { transform: scale(1.15) rotate(45deg); opacity: 1; }
}
@keyframes twinkleSilver {
0%, 100% { transform: scale(1.15) rotate(35deg); opacity: 0.95; }
50% { transform: scale(0.3) rotate(0deg); opacity: 0.15; }
}
@keyframes twinkleCross {
0%, 100% { transform: scale(0.4) rotate(15deg); opacity: 0.25; }
50% { transform: scale(1.2) rotate(60deg); opacity: 1; }
}
.motto-title {
font-family: 'Cinzel Decorative', 'Cinzel', 'Bodoni 72', 'Didot', 'Baskerville', serif;
font-size: 27px;
font-weight: 700;
letter-spacing: 8px;
fill: url(#cosmicText);
animation: cosmicPulse 3.8s ease-in-out infinite;
}
.motto-sub {
font-family: 'Cinzel', 'Baskerville', 'Georgia', serif;
font-size: 11.5px;
font-weight: 600;
letter-spacing: 5px;
text-transform: uppercase;
fill: #CBD5E1;
opacity: 0.85;
}
.gold-star {
transform-origin: center;
animation: twinkleGold 2.7s ease-in-out infinite;
fill: #FCD34D;
filter: drop-shadow(0 0 5px #F59E0B);
}
.silver-star {
transform-origin: center;
animation: twinkleSilver 3.1s ease-in-out infinite;
fill: #FFFFFF;
filter: drop-shadow(0 0 6px #E2E8F0);
}
.gold-star2 {
transform-origin: center;
animation: twinkleCross 2.9s 0.7s ease-in-out infinite;
fill: #FDE68A;
filter: drop-shadow(0 0 5px #F59E0B);
}
.silver-star2 {
transform-origin: center;
animation: twinkleGold 3.3s 0.4s ease-in-out infinite;
fill: #F1F5F9;
filter: drop-shadow(0 0 5px #CBD5E1);
}
.gold-dust { fill: #FCD34D; opacity: 0.75; }
.silver-dust { fill: #F8FAFC; opacity: 0.85; }
</style>
</defs>
<rect width="100%" height="100%" fill="#0d1117" rx="10" stroke="#1f2328" stroke-width="1"/>
<g transform="translate(115, 52)">
<path class="gold-star" d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z"/>
</g>
<g transform="translate(745, 52)">
<path class="gold-star" d="M 0,-9 Q 0,0 9,0 Q 0,0 0,9 Q 0,0 -9,0 Q 0,0 0,-9 Z"/>
</g>
<g transform="translate(190, 32)">
<path class="silver-star" d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z"/>
</g>
<g transform="translate(670, 32)">
<path class="silver-star" d="M 0,-7 Q 0,0 7,0 Q 0,0 0,7 Q 0,0 -7,0 Q 0,0 0,-7 Z"/>
</g>
<g transform="translate(155, 82)">
<path class="silver-star2" d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z"/>
</g>
<g transform="translate(705, 82)">
<path class="gold-star2" d="M 0,-6 Q 0,0 6,0 Q 0,0 0,6 Q 0,0 -6,0 Q 0,0 0,-6 Z"/>
</g>
<circle cx="260" cy="24" r="1.5" class="gold-dust"/>
<circle cx="600" cy="24" r="1.5" class="silver-dust"/>
<circle cx="230" cy="94" r="1.3" class="silver-dust"/>
<circle cx="630" cy="94" r="1.3" class="gold-dust"/>
<circle cx="430" cy="18" r="1.5" class="silver-dust"/>
<text x="430" y="58" text-anchor="middle" class="motto-title">&#10022;  AD ASTRA PER ASPERA  &#10022;</text>
<text x="430" y="88" text-anchor="middle" class="motto-sub">Through Hardships to the Stars</text>
</svg>
